# Alembic 配置。
# 注意：这里刻意不写 sqlalchemy.url —— 数据库凭据不落在这个会被提交的文件里，
# 由 alembic/env.py 从 app.core.config.Settings（即 backend/.env）注入。

[alembic]
script_location = alembic
# 让 alembic 能 import app.*，前提是在 backend/ 目录下执行命令。
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
