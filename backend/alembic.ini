# Alembic configuration.
# NOTE: sqlalchemy.url is deliberately left unset here -- DB credentials must not
# land in this committed file. alembic/env.py injects it from
# app.core.config.Settings (i.e. backend/.env).
#
# Keep this file ASCII-only. alembic reads it through configparser with
# encoding="locale", which resolves via locale.getencoding() to the Windows ANSI
# code page (cp936 on this machine). PYTHONUTF8=1 does NOT change that, so a
# single non-ASCII byte here makes every alembic command die with
# UnicodeDecodeError before it even starts.

[alembic]
script_location = alembic
# Lets alembic import app.*; requires running commands from backend/.
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
