[pytest]
# asyncio_mode = auto：async def 测试函数不需要逐个加 @pytest.mark.asyncio
asyncio_mode = auto
# pytest-asyncio 1.x 默认让夹具和测试各跑在函数级事件循环里。conftest 的
# _prepare_schema 是 session 级，它建完表会把连接归还到 engine 的连接池；
# 下一个测试换了个循环再从池里取到同一条连接，就报
# "got Future attached to a different loop"。统一到同一个 session 级循环，
# 池里的连接才始终属于同一个 loop。
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
markers =
    eval: opt-in real-data evaluation (script-based; not run by default)
# 让 tests/ 里能直接 import app.*，不用先装成包
pythonpath = .
filterwarnings =
    error::DeprecationWarning:app.*
